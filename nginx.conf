server {
  listen 80;
  server_name _;

  # Raiz do site (Vite build)
  root /usr/share/nginx/html;
  index index.html;

  # Gzip básico
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Arquivos estáticos com cache longo (hash no nome evita problemas)
  location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML sem cache agressivo
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback SPA: envia todas as rotas para index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
